<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Post - MasterBlog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Add a New Blog Post ✍️</h1>

        <form action="/add" method="POST">
            <label for="title">Post Title:</label><br>
            <input type="text" id="title" name="title" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>

            <label for="author">Author:</label><br>
            <input type="text" id="author" name="author" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>

            <label for="content">Content:</label><br>
            <textarea id="content" name="content" rows="5" required style="width: 100%; padding: 8px; margin: 8px 0;"></textarea><br>

            <button type="submit" style="padding: 10px 20px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">Add Post</button>
        </form>

        <br>
        <a href="{{ url_for('index') }}">← Back to Home</a>
    </div>
</body>
</html>
