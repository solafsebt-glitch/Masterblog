<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to My Flask Blog!</h1>

        <a href="{{ url_for('add') }}" style="display: inline-block; margin-bottom: 20px; padding: 8px 15px; background: #2c3e50; color: white; text-decoration: none; border-radius: 4px;">+ Add New Post</a>

        {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p><em>Written by {{ post.author }}</em></p>
            <p>{{ post.content }}</p>

            <a href="{{ url_for('update', post_id=post.id) }}" style="color: #3498db; text-decoration: none; font-weight: bold; margin-right: 10px;">Update</a>
            <a href="{{ url_for('delete', post_id=post.id) }}" style="color: #e74c3c; text-decoration: none; font-weight: bold;" onclick="return confirm('Are you sure you want to delete this post?');">Delete</a>
        </div>
        {% endfor %}
    </div>
</body>

</html>
